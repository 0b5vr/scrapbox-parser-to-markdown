name: Init

runs:
  using: 'composite'

  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - uses: pnpm/action-setup@v4
      with:
        version: 9

    - uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-pnpm-${{ hashFiles( 'pnpm-lock.yaml' ) }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install Deps
      run: pnpm install
      shell: bash
