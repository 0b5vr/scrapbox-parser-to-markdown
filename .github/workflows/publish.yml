name: Deploy Release

on:
  push:
    tags:
    - v*

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Init Stuff
      uses: ./.github/actions/init

    - name: Build
      run: yarn build

    - name: Publish
      run: npm publish --provenance --access public
